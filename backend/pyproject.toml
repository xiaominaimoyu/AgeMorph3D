[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agemorph3d-backend"
version = "0.1.0"
description = "Local API for the AgeMorph3D studio"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pillow>=11,<14",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
agemorph3d-backend = "agemorph3d.__main__:main"

[project.optional-dependencies]
inference = [
    "numpy>=2.2,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
